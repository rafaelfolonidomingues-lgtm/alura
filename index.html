<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
<style>
header {
    background-color: #183063;
    color: #FFFFFF;
}
main {
    background-color: #FFFFFF;
    color: #183C63;
}
img {
    width: 150px;
    height: 150px;
    object-fit: cover; /* Evita que a imagem fique esticada ou distorcida */
    border-radius: 50%; /* Deixa a imagem redonda (estilo foto de perfil) */
}
</style>
</head>
<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>
    <main>
        <img src="fael.jpeg" alt="Foto de perfil do Rafael">
        <h2>Meu primeiro post</h2>
        <p>Por: Rafael</p>
        <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
        <button> 💙 0</button>
        <button> 🩵 0</button>
    </main>

<script>
    const buttons = document.querySelectorAll('button');

    // Botão 1: Coração escuro
    let likesAzulEscuro = 0;
    buttons[0].addEventListener('click', () => {
        likesAzulEscuro++;
        buttons[0].textContent = ` 💙 ${likesAzulEscuro}`;
    });

    // Botão 2: Coração azul claro
    let likesAzulClaro = 0;
    buttons[1].addEventListener('click', () => {
        likesAzulClaro++;
        buttons[1].textContent = ` 🩵 ${likesAzulClaro}`;
    });
</script>
</body>
</html>
